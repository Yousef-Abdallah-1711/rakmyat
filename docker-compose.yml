name: rakmyat-phase01

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ['pnpm', 'dev', '--hostname', '0.0.0.0']
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3101:3000'
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    tmpfs:
      - /app/.next:mode=1777
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  app-node-modules:
